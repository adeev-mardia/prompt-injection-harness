[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-injection-harness"
version = "0.1.0"
description = "A test harness for evaluating RAG/agent pipelines against prompt-injection attacks via poisoned documents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Adeev" }]
keywords = ["security", "llm", "rag", "prompt-injection", "red-team", "ai-safety"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "scikit-learn>=1.3",
]

[project.scripts]
injection-harness = "prompt_injection_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
